name: Bug report
description: 报告一个可复现的问题
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把「环境 + 复现步骤 + 实际输出」补齐，这决定了问题能不能被定位。
        如果有崩溃或异常，请先附上 `node bin\check.mjs` 的输出。

  - type: textarea
    id: what-happened
    attributes:
      label: 实际发生了什么
      description: 描述现象，以及你期望的结果。
      placeholder: 点击「执行重命名」后，列表里 3 个文件显示成功，但磁盘上文件名没有变化。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动开始，一步步写清楚。涉及规则栈时请写出规则类型和参数。
      placeholder: |
        1. 双击 start.cmd
        2. 导入 D:\tmp\demo（内含 3 个 .txt）
        3. 加规则：replace, 查找 "IMG", 替换为 "photo"
        4. Ctrl+Enter 执行
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: renamer-web 版本 / 提交
      description: package.json 里的 version，或 `git rev-parse --short HEAD`。
      placeholder: 0.1.0 / 078b185
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - Windows Server
        - 其他（请在下方说明）
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js 版本
      description: `node -v` 的输出。
      placeholder: v24.19.0
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器
      placeholder: Edge 156 / Chrome 143
    validations:
      required: false

  - type: textarea
    id: check-output
    attributes:
      label: 环境体检输出
      description: 在项目目录运行 `node bin\check.mjs`，把结果贴在这里。
      render: text
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 宿主日志在 `.tmp\logs\server.err.log`（启动失败时必看）。注意先抹掉真实路径里的用户名。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 我已经在最新 `main` 上复现过，而不是旧版本
          required: true
        - label: 我运行过 `node test\run.mjs` 且 55 项全过
          required: false
